# Docker Compose file for Minecraft Server Creator
# Copy .env.example to stack.env and fill it in before starting.
services:
  mc-server-creator:
    container_name: mc-server-creator
    image: envidtech/mc-server-creator:latest
    build: .
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./mc-server-creator:/data
      # Optional: Docker calls use this socket first and Portainer only as the backup (see DOCKER_DIRECT in the README)
      # - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment with STORAGE_BACKEND=local. The path must match LOCAL_STORAGE_PATH, and
      # LOCAL_STORAGE_HOST_PATH must be this folder's path on the Docker host.
      # - /mnt/ssd/minecraft:/data/minecraft
    env_file:
      - stack.env
    environment:
      # Overrides MONGODB_URI from stack.env so the app talks to the bundled database
      MONGODB_URI: mongodb://mongo:27017/minecraft-server-creator
    depends_on:
      - mongo

  mongo:
    container_name: mc-server-creator-mongo
    image: mongo:8
    restart: unless-stopped
    volumes:
      - ./mongo:/data/db
